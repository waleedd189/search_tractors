<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بحث القاطرات والمقاولين</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 10px;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    
    .header {
      text-align: center;
      color: white;
      padding: 15px 0;
    }
    
    .header h1 {
      font-size: 1.6rem;
      margin-bottom: 5px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    
    .header p {
      opacity: 0.9;
      font-size: 0.85rem;
    }
    
    .search-container {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    
    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    
    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }
    
    .search-box label {
      display: block;
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
      font-weight: 600;
    }
    
    #searchName, #searchNumber {
      width: 100%;
      padding: 14px 45px 14px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: all 0.3s;
      background: #f8f9fa;
    }
    
    #searchName:focus, #searchNumber:focus {
      border-color: #2a5298;
      background: white;
      box-shadow: 0 0 15px rgba(42, 82, 152, 0.2);
    }
    
    .search-icon {
      position: absolute;
      right: 15px;
      top: 32px;
      font-size: 18px;
      color: #2a5298;
    }
    
    .search-btn {
      background: linear-gradient(135deg, #d32f2f 0%, #b71c1c 100%);
      color: white;
      border: none;
      padding: 14px 30px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 22px;
      box-shadow: 0 4px 15px rgba(211, 47, 47, 0.3);
    }
    
    .search-btn:active {
      transform: scale(0.98);
    }
    
    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      color: #666;
      font-size: 14px;
      border-top: 1px solid #eee;
    }
    
    .results-container {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    
    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #2a5298;
    }
    
    .loading-spinner {
      width: 45px;
      height: 45px;
      border: 4px solid #e0e0e0;
      border-top-color: #2a5298;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .error {
      text-align: center;
      padding: 40px 20px;
      color: #e74c3c;
    }
    
    .error-details {
      font-size: 12px;
      margin-top: 10px;
      color: #999;
      background: #f5f5f5;
      padding: 10px;
      border-radius: 8px;
      word-break: break-all;
    }
    
    .no-results {
      text-align: center;
      padding: 50px 20px;
      color: #666;
    }
    
    .no-results-icon {
      font-size: 50px;
      margin-bottom: 15px;
    }
    
    .table-view {
      overflow-x: auto;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }
    
    thead {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    
    th {
      padding: 12px 10px;
      text-align: right;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      border-left: 1px solid rgba(255,255,255,0.2);
    }
    
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
      color: #333;
      border-left: 1px solid #f0f0f0;
    }
    
    tr:hover {
      background: #e3f2fd;
    }
    
    tr:nth-child(even) {
      background: #fafbfc;
    }
    
    tr:nth-child(even):hover {
      background: #e3f2fd;
    }
    
    .highlight {
      background: #ffeb3b;
      padding: 2px 4px;
      border-radius: 3px;
      font-weight: bold;
    }
    
    .cards-view {
      display: none;
    }
    
    .card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-right: 4px solid #2a5298;
    }
    
    .card-title {
      font-weight: bold;
      color: #1e3c72;
      margin-bottom: 10px;
      font-size: 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eee;
    }
    
    .card-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #f5f5f5;
    }
    
    .card-label {
      color: #666;
      font-size: 12px;
    }
    
    .card-value {
      color: #333;
      font-weight: 500;
      font-size: 13px;
      text-align: left;
      word-break: break-word;
    }
    
    .refresh-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: white;
      border: none;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(30, 60, 114, 0.4);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .refresh-btn:active {
      transform: scale(0.95);
    }
    
    @media (max-width: 768px) {
      .header h1 { font-size: 1.3rem; }
      .search-row { flex-direction: column; }
      .search-box { min-width: 100%; }
      .search-btn { margin-top: 10px; }
      .table-view { display: none; }
      .cards-view { display: block; }
      .stats { font-size: 12px; }
    }
    
    @media (min-width: 769px) {
      .cards-view { display: none !important; }
    }
    
    .fade-in {
      animation: fadeIn 0.4s ease-in;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .retry-btn {
      background: #2a5298;
      color: white;
      border: none;
      padding: 10px 25px;
      border-radius: 25px;
      margin-top: 15px;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚛 بحث القاطرات والمقاولين</h1>
      <p>ابحث بالاسم، رقم البطاقة، رقم القاطرة أو المقطورة</p>
    </div>
    
    <div class="search-container">
      <div class="search-row">
        <div class="search-box">
          <label>🔍 البحث بالاسم أو رقم البطاقة</label>
          <input type="text" id="searchName" placeholder="مثال: على رضوان..." autocomplete="off">
          <span class="search-icon">👤</span>
        </div>
        
        <div class="search-box">
          <label>🔍 البحث برقم القاطرة أو المقطورة</label>
          <input type="text" id="searchNumber" placeholder="مثال: 4697..." autocomplete="off">
          <span class="search-icon">🔢</span>
        </div>
        
        <button class="search-btn" onclick="clearSearch()">مسح البحث</button>
      </div>
      
      <div class="stats">
        <span id="resultsCount">جاري التحميل...</span>
        <span id="lastUpdate">تحديث: الآن</span>
      </div>
    </div>
    
    <div class="results-container">
      <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        <p>جاري تحميل البيانات...</p>
      </div>
      
      <div id="error" class="error" style="display:none;">
        <p>❌ حدث خطأ في تحميل البيانات</p>
        <p class="error-details" id="errorMsg"></p>
        <button class="retry-btn" onclick="loadData()">🔄 إعادة المحاولة</button>
      </div>
      
      <div id="noResults" class="no-results" style="display:none;">
        <div class="no-results-icon">😕</div>
        <p>لا توجد نتائج مطابقة للبحث</p>
      </div>
      
      <div id="tableView" class="table-view" style="display:none;">
        <table id="dataTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      
      <div id="cardsView" class="cards-view" style="display:none;"></div>
    </div>
  </div>
  
  <button class="refresh-btn" onclick="loadData()" title="تحديث البيانات">🔄</button>

  <script>
    // ✅✅✅ رابط الـ Web App بتاعك - غيره لو عملت Deploy جديد
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwlf6p6vwVBe5KCGKNgQeNz89gg4kpKuwqT5OF4Mn0/dev';
    
    let allData = [];
    let headers = [];
    
    async function loadData() {
      showLoading();
      
      try {
        const url = WEB_APP_URL + '?action=getData';
        
        const response = await fetch(url, {
          method: 'GET',
          mode: 'cors',
          headers: { 'Accept': 'application/json' }
        });
        
        if (!response.ok) {
          throw new Error('HTTP error! status: ' + response.status);
        }
        
        const result = await response.json();
        
        if (result.error) {
          throw new Error(result.error);
        }
        
        headers = result.headers || [];
        allData = result.data || [];
        
        displayResults(allData);
        updateStats(allData.length);
        
      } catch (error) {
        console.error('Error:', error);
        showError(error.message);
      }
    }
    
    function performSearch() {
      const nameQuery = document.getElementById('searchName').value.toLowerCase().trim();
      const numberQuery = document.getElementById('searchNumber').value.toLowerCase().trim();
      
      if (!nameQuery && !numberQuery) {
        displayResults(allData);
        updateStats(allData.length);
        return;
      }
      
      const filtered = allData.filter(row => {
        const rowText = row.map(cell => String(cell).toLowerCase()).join(' ');
        
        let matchName = true;
        let matchNumber = true;
        
        if (nameQuery) {
          matchName = rowText.includes(nameQuery);
        }
        
        if (numberQuery) {
          matchNumber = rowText.includes(numberQuery);
        }
        
        return matchName && matchNumber;
      });
      
      displayResults(filtered);
      updateStats(filtered.length, allData.length);
    }
    
    function clearSearch() {
      document.getElementById('searchName').value = '';
      document.getElementById('searchNumber').value = '';
      displayResults(allData);
      updateStats(allData.length);
    }
    
    function displayResults(data) {
      if (data.length === 0) {
        showNoResults();
        return;
      }
      
      hideLoading();
      hideError();
      hideNoResults();
      
      renderTable(data);
      renderCards(data);
      
      document.getElementById('tableView').style.display = 'block';
      document.getElementById('cardsView').style.display = 'block';
    }
    
    function renderTable(data) {
      const thead = document.getElementById('tableHead');
      const tbody = document.getElementById('tableBody');
      
      let headerHtml = '<tr>';
      headers.forEach(h => headerHtml += '<th>' + escapeHtml(h) + '</th>');
      headerHtml += '</tr>';
      thead.innerHTML = headerHtml;
      
      let bodyHtml = '';
      const nameQuery = document.getElementById('searchName').value.toLowerCase();
      const numberQuery = document.getElementById('searchNumber').value.toLowerCase();
      const query = nameQuery || numberQuery;
      
      data.forEach((row, idx) => {
        bodyHtml += '<tr class="fade-in" style="animation-delay:' + (idx * 0.03) + 's">';
        row.forEach((cell) => {
          let cellValue = escapeHtml(String(cell));
          
          if (query && String(cell).toLowerCase().includes(query)) {
            const regex = new RegExp('(' + escapeRegex(query) + ')', 'gi');
            cellValue = cellValue.replace(regex, '<span class="highlight">$1</span>');
          }
          
          bodyHtml += '<td>' + cellValue + '</td>';
        });
        bodyHtml += '</tr>';
      });
      
      tbody.innerHTML = bodyHtml;
    }
    
    function renderCards(data) {
      const container = document.getElementById('cardsView');
      const nameQuery = document.getElementById('searchName').value.toLowerCase();
      const numberQuery = document.getElementById('searchNumber').value.toLowerCase();
      const query = nameQuery || numberQuery;
      
      let html = '';
      data.forEach((row, idx) => {
        const name = escapeHtml(row[1] || 'بدون اسم');
        
        html += '<div class="card fade-in" style="animation-delay:' + (idx * 0.05) + 's">';
        html += '<div class="card-title">👤 ' + name + '</div>';
        
        for (let i = 0; i < headers.length; i++) {
          if (i === 1) continue;
          
          let cellValue = escapeHtml(String(row[i] || '-'));
          
          if (query && String(row[i]).toLowerCase().includes(query)) {
            const regex = new RegExp('(' + escapeRegex(query) + ')', 'gi');
            cellValue = cellValue.replace(regex, '<span class="highlight">$1</span>');
          }
          
          html += '<div class="card-row">';
          html += '<span class="card-label">' + escapeHtml(headers[i]) + ':</span>';
          html += '<span class="card-value">' + cellValue + '</span>';
          html += '</div>';
        }
        
        html += '</div>';
      });
      
      container.innerHTML = html;
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    function escapeRegex(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }
    
    function updateStats(count, total) {
      const countEl = document.getElementById('resultsCount');
      if (total !== undefined) {
        countEl.textContent = 'عرض ' + count + ' من ' + total + ' نتيجة';
      } else {
        countEl.textContent = 'إجمالي النتائج: ' + count;
      }
      
      const now = new Date();
      document.getElementById('lastUpdate').textContent = 
        'تحديث: ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
    }
    
    function showLoading() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('tableView').style.display = 'none';
      document.getElementById('cardsView').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      document.getElementById('noResults').style.display = 'none';
    }
    
    function hideLoading() {
      document.getElementById('loading').style.display = 'none';
    }
    
    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('errorMsg').textContent = msg;
      document.getElementById('error').style.display = 'block';
    }
    
    function hideError() {
      document.getElementById('error').style.display = 'none';
    }
    
    function showNoResults() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('tableView').style.display = 'none';
      document.getElementById('cardsView').style.display = 'none';
      document.getElementById('noResults').style.display = 'block';
    }
    
    function hideNoResults() {
      document.getElementById('noResults').style.display = 'none';
    }
    
    document.getElementById('searchName').addEventListener('input', performSearch);
    document.getElementById('searchNumber').addEventListener('input', performSearch);
    
    loadData();
    setInterval(loadData, 300000);
  </script>
</body>
</html>
